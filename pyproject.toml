[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty50-ma-crossover"
version = "1.0.0"
description = "Algorithmic Trading System: 10-Day vs 30-Day Moving Average Crossover Strategy on NIFTY 50"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Quantitative Research Team"}
]
keywords = [
    "algorithmic-trading",
    "technical-analysis",
    "moving-average-crossover",
    "nifty-50",
    "backtesting",
    "quantitative-finance",
    "stock-market",
    "nse-india"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.30",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
    "streamlit>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
nifty-strategy = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
